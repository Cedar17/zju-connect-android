name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" `
            "platforms;android-36.1" `
            "build-tools;36.0.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Bootstrap gomobile toolchain
        shell: pwsh
        run: ./scripts/bootstrap-gomobile-toolchain.ps1

      - name: Build Go core AAR
        shell: pwsh
        run: ./scripts/build-gomobile-aar.ps1

      - name: Restore release keystore
        shell: pwsh
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_KEYSTORE_BASE64)) {
            throw "RELEASE_KEYSTORE_BASE64 is not configured."
          }
          [IO.File]::WriteAllBytes(
            "app/release.jks",
            [Convert]::FromBase64String($env:RELEASE_KEYSTORE_BASE64)
          )

      - name: Run release unit tests
        shell: pwsh
        run: ./gradlew.bat testReleaseUnitTest --no-daemon

      - name: Build release APK
        shell: pwsh
        run: ./gradlew.bat assembleRelease --no-daemon

      - name: Verify release APK signature
        shell: pwsh
        run: |
          $apk = Get-Item "app/build/outputs/apk/release/zju-connect-$env:GITHUB_REF_NAME-arm64-v8a.apk"
          & "$env:ANDROID_HOME\build-tools\36.0.0\apksigner.bat" verify --verbose --print-certs $apk.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create GitHub Pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $apk = Get-Item "app/build/outputs/apk/release/zju-connect-$env:GITHUB_REF_NAME-arm64-v8a.apk"
          gh release create $env:GITHUB_REF_NAME $apk.FullName `
            --repo $env:GITHUB_REPOSITORY `
            --title $env:GITHUB_REF_NAME `
            --prerelease `
            --generate-notes
