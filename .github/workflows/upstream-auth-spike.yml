name: Upstream auth spike

on:
  pull_request:
    branches: [master]
    paths:
      - "tools/upstream-auth-spike/**"
      - ".github/workflows/upstream-auth-spike.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.6"
          cache-dependency-path: tools/upstream-auth-spike/go.sum
      - name: Checkout upstream auth API baseline
        uses: actions/checkout@v5
        with:
          repository: Mythologyli/zju-connect
          ref: dc3cfa808ecc6dc424a38cf97b4f557dd02314b2
          path: upstream-zju-connect
      - name: Verify compatibility module metadata
        run: go -C tools/upstream-auth-spike mod tidy -diff
      - name: Compile Android-facing upstream auth API
        run: |
          go work init ./tools/upstream-auth-spike ./upstream-zju-connect
          go test ./tools/upstream-auth-spike/...
